<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="200" ry="200" fill="url(#bg)"/>
  <!-- Inner subtle border -->
  <rect x="52" y="52" width="920" height="920" rx="184" ry="184" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>
  <!-- TV screen shape -->
  <rect x="200" y="240" width="624" height="400" rx="32" ry="32" fill="rgba(0,0,0,0.35)" filter="url(#shadow)"/>
  <rect x="216" y="256" width="592" height="368" rx="20" ry="20" fill="rgba(0,0,0,0.25)"/>
  <!-- Signal waves (top-right of screen) -->
  <g transform="translate(720, 320)" stroke="rgba(255,255,255,0.5)" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M0,0 Q20,-20 0,-40"/>
    <path d="M0,0 Q35,-35 0,-70"/>
    <path d="M0,0 Q50,-50 0,-100"/>
  </g>
  <!-- Play triangle -->
  <polygon points="440,360 440,520 580,440" fill="url(#play)" filter="url(#shadow)"/>
  <!-- TV stand -->
  <rect x="420" y="650" width="184" height="12" rx="6" ry="6" fill="rgba(255,255,255,0.25)"/>
  <!-- IPTV text -->
  <text x="512" y="760" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="100" fill="rgba(255,255,255,0.95)" letter-spacing="8">IPTV</text>
</svg>
